<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI General Physician</title><style>body{font-family:system-ui;max-width:640px;margin:0 auto;padding:16px}
#log div{margin:8px 0;padding:10px;border-radius:10px;background:#eef;white-space:pre-wrap}.me{background:#efe!important}.em{background:#fdd!important}
textarea,input{width:100%;box-sizing:border-box;margin:4px 0;padding:8px}textarea{height:70px}button{padding:10px 16px;margin-right:6px}small{color:#666}</style></head><body>
<h2>AI Doctor <small>(sirf maloomat, doctor ka badal nahi)</small></h2>
<div id="auth"><input id="e" placeholder="Email"><input id="p" type="password" placeholder="Password (kam az kam 8 harf)">
<button onclick="a('register')">Account banayein</button><button onclick="a('login')">Login</button><div id="ae"></div></div>
<div id="chat" hidden><div id="log"></div><textarea id="m" placeholder="Apni takleef likhein..."></textarea><button onclick="s()">Bhejein</button></div>
<script>let sid=null,tok=null;const log=document.getElementById('log');
function add(t,c){const d=document.createElement('div');d.className=c||'';d.textContent=t;log.append(d)}
async function post(u,b){return fetch(u,{method:'POST',headers:{'content-type':'application/json',...(tok?{authorization:'Bearer '+tok}:{})},body:JSON.stringify(b)}).then(r=>r.json())}
async function a(k){const r=await post('/auth/'+k,{email:e.value,password:p.value});
if(r.token){tok=r.token;auth.hidden=true;chat.hidden=false;fu()}else ae.textContent=r.error||'Masla aaya'}
async function s(){const el=document.getElementById('m'),m=el.value.trim();if(!m)return;el.value='';add(m,'me');
const r=sid?await post('/api/consult/answer',{sessionId:sid,answer:m}):await post('/api/consult/start',{message:m});
if(r.status==='question'){sid=r.sessionId;add(r.question)}
else if(r.status==='emergency'){sid=null;add(r.reply,'em')}
else if(r.status==='assessment'){sid=null;const x=r.assessment;add('Khulasa:\n'+JSON.stringify(x.reportedFacts,null,1)+'\n\n'+x.uncertainty+'\n\nAgla qadam: '+x.recommendedNextStep+'\n\n'+x.followUp+'\n\n'+r.disclaimer)}
else add(r.error||'Masla aaya')}async function fu(){const r=await fetch('/api/followups/due',{headers:{authorization:'Bearer '+tok}}).then(r=>r.json());if(!Array.isArray(r)||!r.length)return;
const f=r[0];add('Follow-up: pichli baar ke baad aap ki takleef kaisi hai?');
for(const [k,t] of [['improved','Behtar'],['same','Waisi hi'],['worse','Zyada'],['new_symptoms','Naye symptoms']]){const b=document.createElement('button');b.textContent=t;
b.onclick=async()=>{const x=await post('/api/followups/'+f.id+'/respond',{outcome:k});add(x.reply||x.error,x.escalation==='emergency'?'em':'')};log.append(b)}}
</script></body></html>
