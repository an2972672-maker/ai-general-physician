<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI General Physician</title><style>body{font-family:system-ui;max-width:640px;margin:0 auto;padding:16px}
#log div{margin:8px 0;padding:10px;border-radius:10px;background:#eef;white-space:pre-wrap}.me{background:#efe!important}.em{background:#fdd!important}
textarea,input,select{width:100%;box-sizing:border-box;margin:4px 0;padding:8px}textarea{height:70px}button{padding:10px 16px;margin:4px 6px 4px 0}</style></head><body>
<select id="lg" onchange="ap()"><option value="ur-roman">Roman Urdu</option><option value="en">English</option><option value="ur">اردو</option><option value="hi">हिन्दी</option></select>
<h2>AI Doctor</h2><div id="demo" hidden style="background:#ffe08a;padding:8px;border-radius:8px;margin-bottom:8px">DEMO: sirf aazmaish ke liye, asli mareezon ke liye nahi. Is demo mein kuch save nahi hota.</div>
<div id="auth" hidden><input id="e" placeholder="Email"><input id="p" type="password" placeholder="Password (8+)">
<button onclick="a('register')">Register</button><button onclick="a('login')">Login</button><div id="ae"></div></div>
<div id="chat"><input id="ag" type="number" min="0" max="120" step="0.1" placeholder="Age / عمر / उम्र"><select id="au"><option value="y">years / سال / साल</option><option value="m">months / مہینے / महीने</option></select><input id="wt" type="number" min="1" max="150" step="0.1" placeholder="Weight kg / وزن / वज़न"><select id="sx"><option value="">Sex / جنس / लिंग</option><option value="male">Male / مرد / पुरुष</option><option value="female">Female / عورت / महिला</option></select><div id="log"></div><textarea id="m"></textarea><button id="sb" onclick="s()"></button></div>
<script>globalThis.process={env:{OTC_PREVIEW:"true",EMERGENCY_NUMBER:"1122"}}</script>
<script type="module">import { startConsult, answerConsult } from "./src/consultation/flow.js";
document.getElementById('demo').hidden=false;let sid=null,tok=null;const log=document.getElementById('log');
const UI={en:{send:'Send',ph:'Describe your problem...',fq:'Follow-up: how is your problem since last time?',fl:['Better','Same','Worse','New symptoms']},
'ur-roman':{send:'Bhejein',ph:'Apni takleef likhein...',fq:'Follow-up: pichli baar ke baad takleef kaisi hai?',fl:['Behtar','Waisi hi','Zyada','Naye symptoms']},
ur:{send:'بھیجیں',ph:'اپنی تکلیف لکھیں...',fq:'فالو اپ: پچھلی بار کے بعد تکلیف کیسی ہے؟',fl:['بہتر','ویسی ہی','زیادہ','نئی علامات']},
hi:{send:'भेजें',ph:'अपनी तकलीफ़ लिखें...',fq:'फ़ॉलो-अप: पिछली बार के बाद तकलीफ़ कैसी है?',fl:['बेहतर','वैसी ही','ज़्यादा','नए लक्षण']}};
const L=()=>lg.value;
function ap(){const u=UI[L()];m.placeholder=u.ph;sb.textContent=u.send;document.body.dir=L()==='ur'?'rtl':'ltr'}ap();
function add(t,c){const d=document.createElement('div');d.className=c||'';d.textContent=t;log.append(d)}
async function post(u,b){const lang=L();
if(u.endsWith('/start')){const w=Number(b.weightKg);return startConsult('demo',b.message,{sex:b.sex==='male'||b.sex==='female'?b.sex:undefined,ageYears:Number(b.ageYears)||undefined,weightKg:w>=1&&w<=150?w:undefined},lang)}
if(u.endsWith('/answer'))return answerConsult('demo',b.sessionId,b.answer);
return {error:'not available in this demo'}}
async function a(k){const r=await post('/auth/'+k,{email:e.value,password:p.value});
if(r.token){tok=r.token;auth.hidden=true;chat.hidden=false;ap();fu()}else ae.textContent=r.error||'Error'}
function show(x,d){let o='• '+x.reportedFacts.complaint+'\n'+x.factsList.map(f=>'• '+f.q+'\n   → '+f.a).join('\n');
o+='\n\n'+x.uncertainty+'\n\n'+x.recommendedNextStep+'\n\n'+x.warningSigns;
if(x.referral.specialties.length)o+='\n\n'+x.referral.title+'\n- '+x.referral.specialties.join('\n- ');
const t=x.tests;if(t.likely.length||t.possible.length){o+='\n\n';if(t.likely.length)o+=t.likelyTitle+'\n- '+t.likely.join('\n- ')+'\n';
if(t.possible.length)o+=t.possibleTitle+'\n- '+t.possible.join('\n- ')+'\n';o+=t.note}
const od=x.otc;if(od){if(od.items.length){o+='\n\n'+od.title;od.items.forEach(i=>{o+='\n\n• '+od.labels.generic+' '+i.generic+(i.chemicalName?' ('+i.chemicalName+')':'')+'\n  '+od.labels.pk+' '+(i.brandsPK.length?i.brandsPK.join(', '):od.labels.pending)+'\n  '+od.labels.india+' '+(i.brandsIN.length?i.brandsIN.join(', '):od.labels.pending)+'\n  '+od.labels.uses+' '+i.uses+'\n  '+od.labels.how+' '+i.how.join(' ')+(i.doseLines.length?'\n  '+i.doseLines.join('\n  '):'')+'\n  '+od.labels.warning+' '+i.warning});o+='\n\n'+od.doseNote+'\n\n'+od.stopNote}od.notes.forEach(n=>o+='\n\n'+n)}
if(x.reviewNote)o+='\n\n'+x.reviewNote;add(o+'\n\n'+x.followUp+'\n\n'+d)}
async function s(){const el=m,v=el.value.trim();if(!v)return;el.value='';add(v,'me');
const r=sid?await post('/api/consult/answer',{sessionId:sid,answer:v}):await post('/api/consult/start',{message:v,ageYears:(au.value==='m'?ag.value/12:ag.value),weightKg:wt.value,sex:sx.value});
if(r.status==='question'){sid=r.sessionId;add(r.question)}
else if(r.status==='emergency'||r.status==='urgent_stop'){sid=null;add(r.reply,'em')}
else if(r.status==='assessment'){sid=null;show(r.assessment,r.disclaimer)}
else if(r.status==='chat')add(r.reply);else add(r.error||'Error')}
async function fu(){const r=await fetch('/api/followups/due',{headers:{authorization:'Bearer '+tok}}).then(r=>r.json());if(!Array.isArray(r)||!r.length)return;
const f=r[0],u=UI[L()];add(u.fq);['improved','same','worse','new_symptoms'].forEach((k,i)=>{const b=document.createElement('button');b.textContent=u.fl[i];
b.onclick=async()=>{const x=await post('/api/followups/'+f.id+'/respond',{outcome:k});add(x.reply||x.error,x.escalation==='emergency'?'em':'')};log.append(b)})}Object.assign(window,{s,a,ap,fu});</script></body></html>
